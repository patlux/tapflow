# Fork (FORK.md): no a11y-lens job and no pre-push guard. a11y-lens sends staged files to claude, codex or
# cursor-agent, and this fork is worked on with pi. The fork's working branch is `main`, which the upstream
# pre-push guard refuses to push.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm lint

    - name: typecheck
      run: pnpm typecheck
